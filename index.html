<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Priority Number Ticket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .ticket {
            background: #fff;
            padding: 30px;
            border: 2px dashed #333;
            text-align: center;
            width: 250px;
            border-radius: 10px;
        }
        .title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .number {
            font-size: 64px;
            font-weight: bold;
            color: #d9534f;
            margin: 10px 0;
        }
        .counter {
            font-size: 16px;
            color: #333;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="ticket">
        <div class="title">Priority Number</div>
        <div class="number">A-042</div>
        <div class="counter">Please wait for your turn</div>
    </div>

</body>
</html>
